<!doctype html>
<html lang="fr">
  <head>
<script type="text/javascript">
  (function(c,l,a,r,i,t,y){
    c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
    t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;

    y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
  })(window, document, "clarity", "script", "y7egafpusf");
</script>   
 <meta charset="UTF-8" />
    <script>
      // Applies the last-known theme/accent from localStorage before first
      // paint, so a returning user with light mode or a custom accent never
      // sees a flash of the dark/blue default while React boots and the
      // real preference loads from Supabase (usePreferences reconciles
      // once that resolves — see src/hooks/usePreferences.ts).
      (function () {
        try {
          var theme = localStorage.getItem('saveup-theme');
          if (theme === 'light') document.documentElement.dataset.theme = 'light';
          var accent = localStorage.getItem('saveup-accent');
          if (accent && accent !== 'bleu') document.documentElement.dataset.accent = accent;
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b12" />

    <!-- iOS ignores the manifest's display/name fields for "Add to Home
         Screen" — these are the meta tags Safari actually reads for
         standalone mode, the status bar look, and the name under the icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SaveUp" />
    <meta name="description" content="Budget, épargne et objectifs financiers, simplement." />
    <link rel="canonical" href="https://saveup.store/" />
    <title>SaveUp — Reprends le contrôle de ton argent, simplement</title>

    <!-- Open Graph (Facebook, LinkedIn, Slack, Discord, iMessage...). This
         static markup is what a non-JS crawler sees and can only ever be
         one language — src/components/MetaTags.tsx overwrites title/
         description/og:*/twitter:* client-side to match the active
         language (see useLanguage) once the app hydrates, for real
         visitors and any JS-aware unfurler. og:locale/og:locale:alternate
         below are kept in sync the same way. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SaveUp" />
    <meta property="og:title" content="SaveUp — Reprends le contrôle de ton argent, simplement" />
    <meta
      property="og:description"
      content="Budget, épargne et objectifs financiers dans une seule app — sans tableur compliqué. 100% gratuit pour commencer."
    />
    <meta property="og:url" content="https://saveup.store/" />
    <meta property="og:image" content="https://saveup.store/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SaveUp — Reprends le contrôle de ton argent, simplement" />
    <meta property="og:locale" content="fr_CA" />
    <meta property="og:locale:alternate" content="en_CA" />

    <!-- Twitter Card — Twitter/X ignores Open Graph image tags and requires
         its own twitter:image, so this is duplicated rather than reused. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SaveUp — Reprends le contrôle de ton argent, simplement" />
    <meta
      name="twitter:description"
      content="Budget, épargne et objectifs financiers dans une seule app — sans tableur compliqué."
    />
    <meta name="twitter:image" content="https://saveup.store/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
